<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Sabor Express{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <header>
        <h1>Sabor Express</h1>
        <nav>
            {% if session.get('usuario_id') %}
                <a href="{{ url_for('painel') }}">Painel</a>
                <a href="{{ url_for('restaurantes') }}">Restaurantes</a>
                <a href="{{ url_for('logout') }}">Sair</a>
            {% else %}
                <a href="{{ url_for('login') }}">Entrar</a>
                <a href="{{ url_for('cadastro') }}">Cadastrar</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
